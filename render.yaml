services:
  - type: web
    name: garage-bot
    runtime: python
    buildCommand: "pip install -r requirements.txt"
    startCommand: "python garage_bot.py"
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: GROUP_CHAT_ID
        sync: false
      # Строка подключения PostgreSQL (Neon → Connection string), например
      # postgresql://user:password@ep-xxx.neon.tech/neondb?sslmode=require
      - key: DATABASE_URL
        sync: false
