# Тексты сайта студии «ГАРАЖ».
# Меняются здесь, без правки кода. После изменения нужен перезапуск (на Render — деплой).
# Цены, услуги и часы работы сайт берёт из settings.toml, они общие с ботом.
# Пустая строка "" означает «пока неизвестно»: на сайте вместо неё будет написано «уточнить».

[studio]
name = "ГАРАЖ"
tagline = "студия звукозаписи"
city = "Самара"
# Короткое описание для поисковиков и превью ссылки в мессенджерах.
description = "Студия звукозаписи «Гараж» в Самаре: запись, сведение, аранжировка и треки под ключ. Оставьте заявку на сайте."
# Адрес сайта без слэша в конце, например "https://garage-studio.onrender.com". Нужен для превью ссылки.
site_url = ""

[address]
line = "Самара, ул. Высоцкого, 8, 4-й этаж"
# Что искать на карте по кнопке «Открыть на карте».
map_query = "Самара, улица Высоцкого, 8"
intercom = ""
parking = ""
how_to_find = ""

[contacts]
# Ник без @, например "garage_studio".
telegram = ""
# Телефон в любом виде, например "+7 900 000-00-00".
phone = ""

# Оборудование. id связывает запись с предметом на картинке:
# mic, speakers, keys, guitar, shelf. Порядок здесь = порядок на сайте.
# specs — пары «что это» / «значение».

[[gear]]
id = "mic"
title = "Микрофон"
text = "Конденсаторный микрофон на стойке с амортизатором и поп-фильтром."
specs = [["Модель", ""], ["Тип", "конденсаторный"], ["Поп-фильтр", "есть"]]

[[gear]]
id = "speakers"
title = "Мониторы"
text = "Пара студийных мониторов по краям стола."
specs = [["Бренд", "JBL"], ["Модель", ""]]

[[gear]]
id = "keys"
title = "Клавиши"
text = "Белая MIDI-клавиатура на стойке: для аранжировок и набросков партий."
specs = [["Модель", ""], ["Клавиш", ""]]

[[gear]]
id = "guitar"
title = "Гитара"
text = "Чёрный Stratocaster: можно записать живую партию."
specs = [["Модель", ""]]

[[gear]]
id = "shelf"
title = "Стеллаж с техникой"
text = "Звуковая карта, компьютер и всё остальное, что нужно для записи."
specs = [["Звуковая карта", ""], ["Компьютер", ""], ["Наушники", ""]]
