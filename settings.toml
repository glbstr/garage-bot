# Настройки бота студии «ГАРАЖ».
# Цены, услуги и расписание меняются здесь, без правки кода.
# После изменения файла бота нужно перезапустить (на Render — сделать деплой).

# Часовой пояс студии: по нему считаются «сегодня» и прошедшие часы.
timezone = "Europe/Moscow"

[schedule]
# Студия принимает записи с open_hour до close_hour (последний час заканчивается в close_hour).
open_hour = 10
close_hour = 22
# Максимум часов в одной записи.
max_hours = 8
# На сколько дней вперёд можно выбрать дату.
booking_days_ahead = 60
# Выходные дни недели: 1 = понедельник ... 7 = воскресенье. Например: [7]
days_off = []

# Услуги. Порядок здесь = порядок кнопок в боте.
# kind задаёт сценарий:
#   "booking" — выбор часов, даты и времени (запись в студии);
#   "file"    — клиент присылает трек MP3 или WAV (сведение);
#   "genre"   — клиент пишет жанр (аранжировка, трек «под ключ»).
# price_per_hour (необязательно) — для оценки стоимости в сценарии booking.

[[services]]
id = "recording"
kind = "booking"
title = "Запись"
price = "от 1 000 ₽/час"
price_per_hour = 1000

[[services]]
id = "mixing"
kind = "file"
title = "Сведение"
price = "от 1 500 ₽"

[[services]]
id = "arrangement"
kind = "genre"
title = "Аранжировка"
price = "от 1 500 ₽"

[[services]]
id = "turnkey"
kind = "genre"
title = "Трек «под ключ»"
price = "от 5 000 ₽"
